name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Provide the Retrom catalog API used by workspace tests
        uses: actions/checkout@v6
        with:
          repository: retrom-project/retrom
          ref: master
          path: project/retrom
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: make test
